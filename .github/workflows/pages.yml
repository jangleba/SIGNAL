name: Publikacja SIGNAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Pobranie plików
        uses: actions/checkout@v4

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotowanie strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./signal-github

      - name: Publikacja strony
        id: deployment
        uses: actions/deploy-pages@v5
